<style>
  :root{
    --paper:#F5F3EC;
    --paper-2:#EFEBDF;
    --ink:#1B2430;
    --ink-soft:#4A5568;
    --rule:#C9C4B4;
    --rule-soft:#DEDACC;
    --green:#1E7145;
    --green-bg:#E3EFE6;
    --amber:#B8641A;
    --amber-bg:#F5E7D6;
    --blue:#2F5DF4;
    --blue-bg:#E7ECFD;
    --header-w:34px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.55;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  a:focus-visible,
  .tab-bar a:focus-visible,
  .hero .links a:focus-visible,
  .project-links a:focus-visible,
  .contact-row a:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:3px;
  }

  .sheet-frame{
    max-width:980px;
    margin:0 auto;
    padding-bottom:70px;
  }

  .col-ruler{
    display:flex;
    padding-left:var(--header-w);
    position:sticky;
    top:0;
    background:var(--paper-2);
    border-bottom:1px solid var(--rule);
    z-index:20;
  }
  .col-ruler span{
    flex:1;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:5px 0;
    border-right:1px solid var(--rule-soft);
  }
  .col-ruler span:last-child{ border-right:none; }

  .row-body{ display:flex; }
  .row-ruler{
    width:var(--header-w);
    flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--rule);
    display:flex;
    flex-direction:column;
  }
  .row-ruler span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    padding:6px 0;
    border-bottom:1px solid var(--rule-soft);
  }
  .content-col{ flex:1; min-width:0; padding:0 22px; }

  .formula-bar{
    display:flex;
    align-items:center;
    gap:10px
