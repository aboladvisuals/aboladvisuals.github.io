<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emmanuel Abolade — Loading…</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<script>
(async () => {
  const parts = await Promise.all([0,1,2,3].map(i =>
    fetch('/_assemble/index.part' + i).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  ));
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch(e => {
  document.body.textContent = 'Failed to assemble portfolio: ' + e;
});
</script>
</body>
</html>
