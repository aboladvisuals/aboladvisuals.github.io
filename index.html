    --rule-soft:#D9D4C4;

    --amber:#A85A16;
    --amber-bg:#F4E6D4;
    --blue:#2451E0;

    --header-w:36px;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -80px, rgba(36,81,224,0.06), transparent 60%),

    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.58;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  a:focus-visible,
  .tab-bar a:focus-visible,
  .hero .links a:focus-visible,
  .project-links a:focus-visible,
  .contact-row a:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:3px;
  }

  .sheet-frame{
    max-width:1000px;
    margin:0 auto;
    padding-bottom:78px;
  }

  .col-ruler{
    display:flex;
    padding-left:var(--header-w);
    position:sticky;
    top:0;
    background:rgba(233,229,216,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
    z-index:20;
  }
  .col-ruler span{
    flex:1;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    padding:6px 0;
    border-right:1px solid var(--rule-soft);
  }
