<style>
  :root{
    --paper:#F3F1EA;
    --paper-2:#E9E5D8;
    --ink:#15202B;
    --ink-soft:#4A5568;
    --rule:#C5BFAD;
    --rule-soft:#D9D4C4;
    --green:#1A6B40;
    --green-bg:#E2EFE6;
    --amber:#A85A16;
    --amber-bg:#F4E6D4;
    --blue:#2451E0;
    --blue-bg:#E6EBFC;
    --surface:#FFFFFF;
    --shadow:0 1px 2px rgba(21,32,43,0.04), 0 8px 24px rgba(21,32,43,0.05);
    --shadow-hover:0 2px 4px rgba(21,32,43,0.06), 0 14px 32px rgba(21,32,43,0.08);
    --header-w:36px;
    --radius:4px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 50% -80px, rgba(36,81,224,0.06), transparent 60%),
      linear-gradient(180deg, #EEEBE2 0%, var(--paper) 180px);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:16px;
    line-height:1.58;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  a:focus-visible,
  .tab-bar a:focus-visible,
  .hero .links a:focus-visible,
  .project-links a:focus-visible,
  .contact-row a:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:3px;
  }

  .sheet-frame{
    max-width:1000px;
    margin:0 auto;
    padding-bottom:78px;
  }

  .col-ruler{
    display:flex;
    padding-left:var(--header-w);
    position:sticky;
    top:0;
    background:rgba(233,229,216,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
    z-index:20;
  }
  .col-ruler span{
    flex:1;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    padding:6px 0;
    border-right:1px solid var(--rule-soft);
  }
  .col-ruler span:last-child{ border-right:none; }

  .row-body{ display:flex; }
  .row-ruler{
    width:var(--header-w);
    flex-shrink:0;
    background:var(--paper-2);
    border-right:1px solid var(--rule);
    display:flex;
    flex-direction:column;
  }
  .row-ruler span{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    padding:6px 0;
    border-bottom:1px solid var(--rule-soft);
  }
  .content-col{ flex:1; min-width:0; padding:0 26px; }

  .hero{
    padding:42px 0 40px;
    border-bottom:1px solid var(--rule);
  }
  .hero h1{
    margin:0 0 8px;
    font-size:clamp(34px, 5.2vw, 48px);
    letter-spacing:-0.022em;
    line-height:1.08;
    font-weight:700;
  }
  .hero .role{
    font-family:'IBM Plex Mono', monospace;
    font-size:14.5px;
    color:var(--blue);
    margin:0 0 20px;
    letter-spacing:0.01em;
  }
  .hero p.lede{
    max-width:64ch;
    font-size:17px;
    color:var(--ink-soft);
    margin:0 0 14px;
  }
  .hero .links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .hero .links a{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink);
    text-decoration:none;
    border:1px solid var(--rule);
    background:var(--surface);
    padding:8px 13px;
    border-radius:var(--radius);
    transition:border-color .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .hero .links a:hover{
    border-color:var(--blue);
    color:var(--blue);
    box-shadow:var(--shadow);
    transform:translateY(-1px);
  }

  section, footer#contact{
    padding:48px 0;
    border-bottom:1px solid var(--rule);
    scroll-margin-top:64px;
  }
  section:last-of-type{ border-bottom:none; }
  footer#contact{ border-bottom:none; }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin:0 0 6px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  h2{
    font-size:clamp(22px, 3vw, 26px);
    margin:0 0 20px;
    font-weight:700;
    letter-spacing:-0.015em;
  }
  h3{
    font-size:15.5px;
    margin:30px 0 12px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  h3:first-child{ margin-top:0; }
  .section-intro{
    color:var(--ink-soft);
    max-width:70ch;
    margin:-6px 0 26px;
  }

  .job{ margin-bottom:28px; }
  .job:last-child{ margin-bottom:0; }
  .job-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  .job-title{ font-weight:600; font-size:17px; }
  .job-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .job ul{ margin:8px 0 0; padding-left:20px; color:var(--ink-soft); }
  .job li{ margin-bottom:6px; }

  .project{
    margin-bottom:28px;
    padding:0;
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .project:hover{
    border-color:#B7B19D;
    box-shadow:var(--shadow-hover);
    transform:translateY(-2px);
  }
  .project:last-child{ margin-bottom:0; }
  .project.featured{
    border-color:rgba(36,81,224,0.35);
    box-shadow:inset 3px 0 0 var(--blue), var(--shadow);
  }
  .project.featured:hover{
    border-color:rgba(36,81,224,0.55);
    box-shadow:inset 3px 0 0 var(--blue), var(--shadow-hover);
  }
  .project-body{ padding:18px 18px 16px; }
  .project-kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--blue);
    margin:0 0 8px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .project-media{
    display:block;
    margin:0;
    background:linear-gradient(180deg, #E8E4D6, #F4F1E8);
    border-bottom:1px solid var(--rule-soft);
    overflow:hidden;
  }
  .project-media img{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    object-fit:cover;
    object-position:top center;
    transition:transform .45s ease;
  }
  .project:hover .project-media img{ transform:scale(1.02); }
  .project-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:4px;
  }
  .project-title{ font-weight:600; font-size:17px; letter-spacing:-0.01em; }
  .project-stack{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .project-desc{ color:var(--ink-soft); margin:8px 0 14px; max-width:70ch; }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:0 0 12px;
  }
  .chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:4px 8px;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink-soft);
    border-radius:2px;
  }
  .chip.track-data{ background:var(--green-bg); color:var(--green); border-color:transparent; }
  .chip.track-soft{ background:var(--blue-bg); color:var(--blue); border-color:transparent; }

  table.metrics{
    width:100%;
    border-collapse:collapse;
    background:var(--surface);
    border:1px solid var(--rule);
    font-size:14px;
    border-radius:var(--radius);
    overflow:hidden;
  }
  table.metrics caption{
    caption-side:top;
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 0 8px;
  }
  table.metrics th{
    text-align:left;
    font-family:'IBM Plex Mono', monospace;
    font-weight:500;
    font-size:11px;
    color:var(--ink-soft);
    background:var(--paper-2);
    padding:8px 12px;
    border-bottom:1px solid var(--rule);
    border-right:1px solid var(--rule-soft);
  }
  table.metrics th:last-child, table.metrics td:last-child{ border-right:none; }
  table.metrics td{
    padding:9px 12px;
    border-bottom:1px solid var(--rule-soft);
    border-right:1px solid var(--rule-soft);
    vertical-align:top;
  }
