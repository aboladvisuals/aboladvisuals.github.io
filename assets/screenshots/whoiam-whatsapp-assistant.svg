<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">WHOIAM WhatsApp Assistant</title>
  <desc id="desc">Typographic project cover on a dark background, with the name WHOIAM WhatsApp Assistant and the stack Node.js, WhatsApp Cloud API and OpenAI. Abstract message-bubble shapes, no real chat text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M64 0v500M128 0v500M192 0v500M256 0v500M320 0v500M384 0v500M448 0v500M512 0v500M576 0v500M640 0v500M704 0v500"/>
    <path d="M0 64h800M0 128h800M0 192h800M0 256h800M0 320h800M0 384h800M0 448h800"/>
  </g>
  <!-- abstract bubbles, empty of message text -->
  <rect x="56" y="300" width="150" height="44" rx="22" fill="#6fd8bf" fill-opacity="0.16" stroke="#6fd8bf" stroke-opacity="0.45"/>
  <rect x="56" y="356" width="210" height="44" rx="22" fill="#8ab4ff" fill-opacity="0.12" stroke="#8ab4ff" stroke-opacity="0.35"/>
  <rect x="580" y="312" width="164" height="44" rx="22" fill="#f2b66d" fill-opacity="0.14" stroke="#f2b66d" stroke-opacity="0.4"/>
  <text x="56" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.18em" fill="#8f9aae">CASE STUDY</text>
  <text x="56" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#e9edf4">WHOIAM</text>
  <text x="56" y="228" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="32" font-weight="500" fill="#6fd8bf">WhatsApp Assistant</text>
  <text x="56" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#b3bccb">Ordering and catering, in the chat</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#e9edf4">
    <rect x="56" y="430" width="70" height="26" rx="13" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.16)"/>
    <text x="91" y="447" text-anchor="middle">Node.js</text>
    <rect x="134" y="430" width="70" height="26" rx="13" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.16)"/>
    <text x="169" y="447" text-anchor="middle">Express</text>
    <rect x="212" y="430" width="148" height="26" rx="13" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.16)"/>
    <text x="286" y="447" text-anchor="middle">WhatsApp Cloud API</text>
    <rect x="368" y="430" width="70" height="26" rx="13" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.16)"/>
    <text x="403" y="447" text-anchor="middle">OpenAI</text>
  </g>
</svg>
